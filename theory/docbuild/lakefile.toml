# The documentation of the metatheory, generated by doc-gen4 in a package of its own, as its README
# recommends, so that the package of the metatheory does not depend on it.
name = "docbuild"
reservoir = false
version = "0.1.0"
packagesDir = "../.lake/packages"

[[require]]
scope = "leanprover"
name = "doc-gen4"
# The release of doc-gen4 for the version of Lean of flake.lock.
rev = "v4.34.1"

[[require]]
name = "sic"
path = "../"

# A module that imports every module of Sic/ and SicTest/, written by nix run .#docs, which git
# ignores: its documentation is that of every module it imports, while the libraries of the
# metatheory list their modules by globs, which the facet docs of a library does not read.
[[lean_lib]]
name = "SicDocs"
